name: pol_ff_cle
channels:
  - conda-forge
  - psi4
dependencies:
  - python =3.12  # qcelemental v1 models need pydantic.v1 (unavailable on 3.14+); matches CI
  - pip
  - psi4 >= 1.9.1
  - pycifrw
  - numpy
  - qcelemental
  - mdanalysis
  - networkx
  - pandas
  - matplotlib
  - jax
  - pip:
    - optax
    - jaxopt
