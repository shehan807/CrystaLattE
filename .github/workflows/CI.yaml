name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 2 * * 1"

jobs:
  test:
    name: 🐍 ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Additional Build Info
      shell: bash
      run: |
        uname -a
        df -h
        ulimit -a

    - name: Create Environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: ${{ matrix.python-version }}
        environment-file: devtools/conda-envs/test_env.yaml
        activate-environment: test
        auto-activate-base: false
        show-channel-urls: true

    - name: Install crystalatte
      # conda setup requires this special shell
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps
        conda list

    - name: Run tests
      # conda setup requires this special shell
      shell: bash -l {0}

      run: |
        pytest -v --color=yes crystalatte/tests/

  test-polarization-ff:
    # Optional lane: JAX Drude polarization plugin (skipped by `test` via importorskip).
    name: polarization_ff (optional)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Create Environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        environment-file: examples/polarization_ff/pol_ff_cle.yml
        activate-environment: pol_ff_cle
        auto-activate-base: false
        show-channel-urls: true

    - name: Install crystalatte
      shell: bash -l {0}
      run: |
        python -m pip install pytest
        python -m pip install . --no-deps
        # Fail loudly (instead of skipping) if the plugin cannot import.
        python -c "import crystalatte.plugins.polarization_ff"

    - name: Run tests
      shell: bash -l {0}
      run: |
        pytest -v --color=yes crystalatte/tests/test_96_polarization_ff.py
